<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Azrael Window Use</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="renderer.cjs"></script>
</head>
<body>
  <header class="titlebar">
    <div class="brand"><img src="../assets/app-icon-32.png" width="22" height="22" alt=""> <span id="brand-name">Azrael Window Use</span></div>
    <div class="window-actions">
      <button class="icon-button" id="minimize" aria-label="최소화" title="최소화">−</button>
      <button class="icon-button close-button" id="close" aria-label="닫기" title="닫기">×</button>
    </div>
  </header>
  <template id="settings-icon"><svg class="settings-glyph" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <g transform="translate(0 -.5)">
    <path d="m9.5 3-.6 2.2-1.7 1L5 5.6 2.5 10l1.6 1.6v1.9L2.5 15 5 19.4l2.2-.6 1.7 1 .6 2.2h5l.6-2.2 1.7-1 2.2.6 2.5-4.4-1.6-1.5v-1.9l1.6-1.6L19 5.6l-2.2.6-1.7-1L14.5 3z"/>
    <circle cx="12" cy="12.5" r="3.1"/>
  </g>
</svg></template>
  <main id="main" aria-busy="true"><p class="loading" role="status">설정을 불러오는 중…</p></main>
  <footer><div id="footer-left"></div><span id="save-status" role="status" aria-live="polite"></span><div id="footer-right"><span id="version"></span></div></footer>
</body>
</html>
