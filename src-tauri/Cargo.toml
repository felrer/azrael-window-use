[package]
name = "azrael-window-use"
version = "0.1.1"
description = "Azrael Window Use native desktop shell"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
base64 = "0.22"
png = "0.17"
file_icon_provider = "1.0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
